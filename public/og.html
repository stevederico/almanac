<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      box-sizing: border-box;
      padding: 64px 72px;
      background: #111210;
      color: #e9e6da;
      font: 500 16px/1.2 "IBM Plex Mono", "JetBrainsMono NF", "JetBrains Mono", ui-monospace, Menlo, monospace;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .word { font-size: 26px; font-weight: 600; }
    .word i { font-style: normal; color: #f2b84b; }
    h1 { margin: 0 0 24px; font-size: 82px; line-height: 1.02; letter-spacing: -0.04em; font-weight: 500; max-width: 980px; }
    p { margin: 0; font-size: 28px; color: #a29e90; }
    .feeds { display: flex; gap: 40px; padding-top: 24px; border-top: 1px solid #2a2c25; font-size: 22px; color: #f2b84b; }
  </style>
</head>
<body>
  <div class="word">almanac<i>_</i></div>
  <div>
    <h1>Your agent keeps the calendar.</h1>
    <p>Calendar, todos and notes. One key.</p>
  </div>
  <div class="feeds"><span>/events</span><span>/todos</span><span>/notes</span></div>
</body>
</html>
